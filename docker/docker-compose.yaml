# version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: ledger_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
